// Robolectric would otherwise download its Android image from inside the test run, with no retry.
// Gradle fetches it like any dependency (retries, cache) and the tests run offline.
configurations {
    robolectricRuntime { transitive = false }
}

dependencies {
    testImplementation 'org.robolectric:robolectric:4.16.1'
    robolectricRuntime 'org.robolectric:android-all-instrumented:15-robolectric-13954326-i7'
}

def robolectricJars = tasks.register('robolectricJars', Sync) {
    from configurations.robolectricRuntime
    into layout.buildDirectory.dir('robolectric-jars')
}

android {
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn robolectricJars
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', robolectricJars.get().destinationDir.path
        }
    }
}
