sonar.projectKey=ABovsh_svitlyachok
sonar.organization=abovsh
sonar.projectName=Світлячок
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main
sonar.tests=app/src/test
sonar.exclusions=app/src/main/assets/**
sonar.java.source=17
sonar.java.binaries=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.test.binaries=app/build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml

# Coverage is measured for the logic (Logic.java: every text, state, reminder and the file
# checks). Screens, views, the widget bitmap and system glue need a device: they are checked
# on an emulator before each release, not by unit tests.
sonar.coverage.exclusions=app/src/main/java/**/*Activity.java,app/src/main/java/**/*View.java,\
  app/src/main/java/**/Base.java,app/src/main/java/**/FlowRow.java,app/src/main/java/**/Ui.java,\
  app/src/main/java/**/WidgetArt.java,app/src/main/java/**/Sync.java,app/src/main/java/**/Store.java,\
  app/src/main/java/**/Prefs.java,app/src/main/java/**/*Receiver.java,app/src/main/java/**/FetchJob.java,\
  app/src/main/java/**/LightWidget.java
